# Cloud Build: image in asia-southeast1, then deploy the worker service para-music.
# The studio stays on Vercel. This file does not deploy a web service.
# Trigger this on branch `dev` only. Do not deploy `main`.
#
# The Artifact Registry repo `para-music` must already exist in asia-southeast1.
# An empty _RUN_SERVICE_ACCOUNT keeps the service account already on para-music.

substitutions:
  _REGION: asia-southeast1
  _REPO: para-music
  _SERVICE_WORKER: para-music
  _RUN_SERVICE_ACCOUNT: ""
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_APP_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - INSTALL_BASIC_PITCH=true
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA"
        SA_ARGS=()
        if [[ -n "${_RUN_SERVICE_ACCOUNT}" ]]; then
          SA_ARGS=(--service-account "${_RUN_SERVICE_ACCOUNT}")
        fi
        COMMON_SECRETS="DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SESSION_SECRET=SESSION_SECRET:latest,ADMIN_SECRET=ADMIN_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
        gcloud run deploy ${_SERVICE_WORKER} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --port 8080 \
          --cpu 2 \
          --memory 2Gi \
          --min-instances 1 \
          --max-instances 1 \
          --timeout 3600 \
          --no-cpu-throttling \
          --command npm \
          --args run,worker \
          --no-allow-unauthenticated \
          "$${SA_ARGS[@]}" \
          --update-secrets "$$COMMON_SECRETS" \
          --update-env-vars "NODE_ENV=production,ANALYZE_BACKEND=librosa,BASIC_PITCH=1,GEMINI_MODEL_TRAIN=gemini-3.1-pro-preview,GEMINI_MODEL_COMPARE=gemini-3.5-flash"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
