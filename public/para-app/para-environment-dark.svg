<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000"><title>PARA dark application environment</title><desc>Editable gradients derived from approved warm/deep colours. Add separate 256px grain tile at prescribed opacity; no grain embedded.</desc><defs><radialGradient id="warm-field" cx="100%" cy="0%" r="110%"><stop stop-color="#8B5E34" stop-opacity=".62"/><stop offset=".75" stop-color="#3B2F2A" stop-opacity="0"/></radialGradient><radialGradient id="response-field" cx="0%" cy="100%" r="85%"><stop stop-color="#D6B98C" stop-opacity=".18"/><stop offset="1" stop-color="#3B2F2A" stop-opacity="0"/></radialGradient></defs><g id="base" inkscape:groupmode="layer" inkscape:label="01 / Canvas"><path fill="#3B2F2A" d="M0 0h1600v1000H0z"/></g><g id="field" inkscape:groupmode="layer" inkscape:label="02 / Warm gradient"><path fill="url(#warm-field)" d="M0 0h1600v1000H0z"/></g><g id="response" inkscape:groupmode="layer" inkscape:label="03 / Quiet response gradient"><path fill="url(#response-field)" d="M0 0h1600v1000H0z"/></g></svg>