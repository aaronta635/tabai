# Cloud Build: push to Artifact Registry in Tokyo, then deploy howl0-web + howl0-worker.
# Trigger this on branch `dev` only. Do not deploy `main`.
#
# Substitutions: _REGION, _REPO, _SERVICE_WEB, _SERVICE_WORKER

substitutions:
  _REGION: asia-northeast1
  _REPO: howl0
  _SERVICE_WEB: howl0-web
  _SERVICE_WORKER: howl0-worker
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_APP_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA"
        COMMON_SECRETS="DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SESSION_SECRET=SESSION_SECRET:latest,ADMIN_SECRET=ADMIN_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
        gcloud run deploy ${_SERVICE_WEB} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --port 8080 \
          --cpu 1 \
          --memory 1Gi \
          --min-instances 0 \
          --max-instances 5 \
          --timeout 300 \
          --cpu-throttling \
          --allow-unauthenticated \
          --service-account "howl0-run@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-secrets "$$COMMON_SECRETS" \
          --set-env-vars "NODE_ENV=production,PORT=8080"
        gcloud run deploy ${_SERVICE_WORKER} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --port 8080 \
          --cpu 2 \
          --memory 2Gi \
          --min-instances 1 \
          --max-instances 1 \
          --timeout 3600 \
          --no-cpu-throttling \
          --command npm \
          --args run,worker \
          --no-allow-unauthenticated \
          --service-account "howl0-run@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-secrets "$$COMMON_SECRETS" \
          --set-env-vars "NODE_ENV=production,PORT=8080,ANALYZE_BACKEND=librosa"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
