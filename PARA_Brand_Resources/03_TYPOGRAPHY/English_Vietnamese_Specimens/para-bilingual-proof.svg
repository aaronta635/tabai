<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1080" viewBox="0 0 1500 1080"><title>PARA bilingual proof</title><desc>Review 01. Editable vector forms and gradients; separately clipped raster grain. No generated imagery.</desc><defs></defs><g inkscape:groupmode="layer" inkscape:label="Editable text specimens" id="editable-text-specimens"><rect x="0" y="0" width="1500" height="1080" rx="0" fill="#F3EDE2"/><text x="64" y="74" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="28" font-weight="600">PARA / bilingual typography proof</text><text x="64" y="148" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="12" font-weight="500">EN / 32 px</text><text x="770" y="148" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="12" font-weight="500">VI / 32 px</text><text x="64" y="190" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">See the progress</text><text x="64" y="234" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">between lessons.</text><text x="770" y="190" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">Thấy được từng bước tiến bộ</text><text x="770" y="234" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">giữa những buổi học.</text><text x="64" y="308" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="17" font-weight="400">See the progress between lessons.</text><text x="770" y="308" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="17" font-weight="400">Thấy được từng bước tiến bộ giữa những buổi học.</text><text x="64" y="408" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="12" font-weight="500">EN / 32 px</text><text x="770" y="408" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="12" font-weight="500">VI / 32 px</text><text x="64" y="450" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">Feedback is a signal,</text><text x="64" y="494" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">not a verdict.</text><text x="770" y="450" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">Góp ý là tín hiệu để tiến bộ,</text><text x="770" y="494" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">không phải lời phán xét.</text><text x="64" y="568" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="17" font-weight="400">Feedback is a signal, not a verdict.</text><text x="770" y="568" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="17" font-weight="400">Góp ý là tín hiệu để tiến bộ, không phải lời phán xét.</text><text x="64" y="668" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="12" font-weight="500">EN / 32 px</text><text x="770" y="668" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="12" font-weight="500">VI / 32 px</text><text x="64" y="710" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">A clearer next step.</text><text x="770" y="710" fill="#3B2F2A" font-family="Plus Jakarta Sans" font-size="32" font-weight="600">Hiểu rõ bước luyện tập tiếp theo.</text><text x="64" y="828" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="17" font-weight="400">A clearer next step.</text><text x="770" y="828" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="17" font-weight="400">Hiểu rõ bước luyện tập tiếp theo.</text><text x="64" y="1025" fill="#8B5E34" font-family="Be Vietnam Pro" font-size="14" font-weight="400">Headlines: Plus Jakarta Sans 600 / 1.3–1.4 line height. Body: Be Vietnam Pro 400 / 1.65. Original SIL OFL licences included.</text></g></svg>